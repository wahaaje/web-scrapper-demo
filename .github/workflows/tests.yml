name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test extraction, recovery and exports
        run: python -m unittest discover -s tests -v
      - name: Run fixture demo
        run: python scraper.py --demo --output output/ci-demo
      - name: Resume fixture demo
        run: python scraper.py --demo --output output/ci-demo --resume
